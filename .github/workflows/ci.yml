name: OCRS CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Clean lockfile installation
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: Linting
        run: npm run lint
      - name: Schema validation
        run: npm run validate:schemas
      - name: Valid package validation
        run: npm run validate:packages
      - name: Invalid fixture expected failures
        run: npm run validate:invalid
      - name: Reference integrity
        run: npm run validate:references
      - name: Unit and semantic tests
        run: npm test
      - name: Ready RFDC evaluation
        run: npm run rfdc:evaluate:ready
      - name: Not-ready RFDC evaluation
        run: npm run rfdc:evaluate:not-ready
      - name: Complete OCRS conformance suite
        run: npm run conformance
